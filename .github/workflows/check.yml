name: Check City_tour
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check draw.js
          node --check world.js
          node --check traffic.js
          node --check walker.js
      - name: Verify map, crossings, traffic and routes
        run: node tests.cjs
